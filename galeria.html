<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff}
.topo{position:sticky;top:0;background:#fff;padding:18px 16px 10px;border-bottom:1px solid #eee}
.voltar{text-decoration:none;color:#007aff}
h1{font-size:34px;margin-top:10px}
.subtitulo{color:#777;margin-top:4px}
.galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:10px}
.foto{width:100%;aspect-ratio:1/1;object-fit:cover;cursor:pointer}
.lightbox{display:none;position:fixed;inset:0;background:#000;justify-content:center;align-items:center;flex-direction:column}
.lightbox img{max-width:100%;max-height:82vh}
.fechar{position:absolute;top:18px;right:20px;color:#fff;font-size:34px;cursor:pointer}
.info{color:#fff;padding:15px}
.botoes{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-around;color:#fff;font-size:24px}
</style>
</head>
<body>
<div class="topo">
<a class="voltar" href="COLE_AQUI_O_LINK_PARA_VOLTAR">← Voltar</a>
<h1>Fotos</h1>
<div class="subtitulo">Todas as fotos</div>
</div>
<div class="galeria">
<img class="foto" src="https://picsum.photos/id/1011/600/600" onclick="abrir(this.src,'27 de junho')">
<img class="foto" src="https://picsum.photos/id/1027/600/600" onclick="abrir(this.src,'26 de junho')">
<img class="foto" src="https://picsum.photos/id/1035/600/600" onclick="abrir(this.src,'25 de junho')">
<img class="foto" src="https://picsum.photos/id/1043/600/600" onclick="abrir(this.src,'20 de junho')">
<img class="foto" src="https://picsum.photos/id/1050/600/600" onclick="abrir(this.src,'18 de junho')">
<img class="foto" src="https://picsum.photos/id/1062/600/600" onclick="abrir(this.src,'15 de junho')">
<img class="foto" src="https://picsum.photos/id/1074/600/600" onclick="abrir(this.src,'10 de junho')">
<img class="foto" src="https://picsum.photos/id/1084/600/600" onclick="abrir(this.src,'8 de junho')">
<img class="foto" src="https://picsum.photos/id/1080/600/600" onclick="abrir(this.src,'5 de junho')">
</div>
<div class="lightbox" id="lightbox">
<span class="fechar" onclick="fechar()">×</span>
<img id="imagemAberta">
<div class="info" id="dataFoto"></div>
<div class="botoes"><span>♡</span><span>↗</span><span>🗑</span></div>
</div>
<script>
function abrir(src,data){
document.getElementById('imagemAberta').src=src;
document.getElementById('dataFoto').innerText=data;
document.getElementById('lightbox').style.display='flex';
}
function fechar(){
document.getElementById('lightbox').style.display='none';
}
</script>
</body>
</html>
